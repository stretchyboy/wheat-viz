<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="Agricultural Trade Data Visualization" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta id="theme-color" name="theme-color" content="#fff" />
        
        <title>Agricultural Trade Visualization</title>
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: 'Helvetica Neue', Arial, sans-serif;
                background: #1a1a1a;
                color: #fff;
                overflow: hidden;
            }
            
            #selector-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.95);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 1000;
                transition: opacity 0.3s ease;
            }
            
            #selector-overlay.hidden {
                opacity: 0;
                pointer-events: none;
            }
            
            .selector-container {
                background: #2a2a2a;
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
                max-width: 500px;
                width: 90%;
            }
            
            h1 {
                margin-bottom: 30px;
                font-size: 2em;
                text-align: center;
            }
            
            .form-group {
                margin-bottom: 25px;
            }
            
            label {
                display: block;
                margin-bottom: 10px;
                font-weight: bold;
                color: #aaa;
            }
            
            select {
                width: 100%;
                padding: 12px;
                font-size: 16px;
                border: 2px solid #444;
                border-radius: 5px;
                background: #1a1a1a;
                color: #fff;
                cursor: pointer;
            }
            
            select:focus {
                outline: none;
                border-color: #4CAF50;
            }
            
            button {
                width: 100%;
                padding: 15px;
                font-size: 18px;
                font-weight: bold;
                background: #4CAF50;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background 0.3s ease;
            }
            
            button:hover {
                background: #45a049;
            }
            
            button:disabled {
                background: #666;
                cursor: not-allowed;
            }
            
            #video-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            
            video {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            
            #graph-overlay {
                position: fixed;
                bottom: 50px;
                left: 50px;
                right: 50px;
                height: 300px;
                z-index: 10;
                pointer-events: none;
            }
            
            #graph-canvas {
                width: 100%;
                height: 100%;
            }
            
            #info-overlay {
                position: fixed;
                top: 20px;
                left: 20px;
                z-index: 20;
                background: rgba(0, 0, 0, 0.7);
                padding: 20px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
            }
            
            #info-overlay h2 {
                margin-bottom: 10px;
                font-size: 1.5em;
            }
            
            #info-overlay .data-row {
                margin: 5px 0;
                font-size: 1.1em;
            }
            
            #info-overlay .data-label {
                color: #aaa;
                margin-right: 10px;
            }
            
            #info-overlay .data-value {
                color: #4CAF50;
                font-weight: bold;
            }
            
            #controls {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 20;
                background: rgba(0, 0, 0, 0.7);
                padding: 15px;
                border-radius: 10px;
                backdrop-filter: blur(10px);
            }
            
            #controls button {
                width: auto;
                padding: 10px 20px;
                margin: 5px;
                font-size: 14px;
            }
            
            .loading {
                text-align: center;
                padding: 20px;
                color: #aaa;
            }
        </style>
    </head>
    <body>
        <!-- Selector Overlay -->
        <div id="selector-overlay">
            <div class="selector-container">
                <h1>Agricultural Trade Visualization</h1>
                
                <div class="form-group">
                    <label for="crop-select">Select Crop:</label>
                    <select id="crop-select">
                        <option value="">Loading crops...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="country-select">Select Country:</label>
                    <select id="country-select">
                        <option value="">Loading countries...</option>
                    </select>
                </div>
                
                <button id="visualize-btn" disabled>Visualize</button>
                <div class="loading" id="loading-message" style="display:none;">Loading data...</div>
            </div>
        </div>
        
        <!-- Video Container (hidden initially) -->
        <div id="video-container" style="display:none;">
            <video id="main-video" muted loop>
                <source src="../videos/Wheat Field - Crop Timelapse-SD.mp4#t=6" type="video/mp4" />
            </video>
        </div>
        
        <!-- Graph Overlay -->
        <canvas id="graph-canvas" style="display:none;"></canvas>
        
        <!-- Info Overlay -->
        <div id="info-overlay" style="display:none;">
            <h2><span id="info-crop">Wheat</span> - <span id="info-country">Country</span></h2>
            <div class="data-row">
                <span class="data-label">Year:</span>
                <span class="data-value" id="info-year">----</span>
            </div>
            <div class="data-row">
                <span class="data-label">Import Price:</span>
                <span class="data-value">$<span id="info-price">----</span>/tonne</span>
            </div>
            <div class="data-row">
                <span class="data-label">Import Quantity:</span>
                <span class="data-value"><span id="info-quantity">----</span> tonnes</span>
            </div>
        </div>
        
        <!-- Controls -->
        <div id="controls" style="display:none;">
            <button id="change-btn">Change Selection</button>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/rough/4.5.2/rough.min.js"></script>
        <script src="visualization.js"></script>
    </body>
</html>
